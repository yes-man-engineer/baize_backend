services:
  mysql:
    image: mysql:8.0
    container_name: baize_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: startup_copilot
      MYSQL_USER: baize
      MYSQL_PASSWORD: ${DB_PASSWORD:-baize123}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 只建库；表结构由 GORM AutoMigrate 维护。
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: baize_app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: prod
      APP_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: baize
      DB_PASSWORD: ${DB_PASSWORD:-baize123}
      DB_NAME: startup_copilot
      # LLM_API_KEY 必填：不填服务照样起得来，但所有走模型的接口都会报错，
      # 启动日志里会有一条 warn。这里不用 :? 硬失败，否则 down / logs / ps
      # 这些子命令也会跟着报变量缺失。
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
